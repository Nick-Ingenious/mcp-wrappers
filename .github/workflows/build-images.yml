name: Build & publish MCP wrapper images

on:
  push:
    branches: [main]
    paths:
      - 'integrations/**'
      - 'shared-wrapper/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch: {}  # allow manual rebuilds

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Add a new entry per integration directory under integrations/.
        # Each entry: id (lowercase, used in image name) + the Dockerfile path.
        integration:
          - id: gong
            dockerfile: integrations/gong/Dockerfile
          - id: generic-npx
            dockerfile: integrations/generic-npx/Dockerfile
          - id: generic-git
            dockerfile: integrations/generic-git/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .                          # repo root so Dockerfiles can COPY shared-wrapper
          file: ${{ matrix.integration.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mcp-${{ matrix.integration.id }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mcp-${{ matrix.integration.id }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.integration.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.integration.id }}
